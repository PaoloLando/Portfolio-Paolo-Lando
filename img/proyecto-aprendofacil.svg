<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Ilustración del formulario de login y el gestor de categorías">
  <rect width="640" height="360" fill="#0a2a5e"/>
  <!-- Tarjeta de login -->
  <rect x="50" y="50" width="240" height="260" rx="14" fill="#0f3a7d" stroke="#f6c500" stroke-width="3"/>
  <text x="170" y="95" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#f6c500">Iniciar sesión</text>
  <rect x="75" y="120" width="190" height="34" rx="6" fill="#ffffff"/>
  <text x="85" y="143" font-family="Arial, sans-serif" font-size="14" fill="#5b6b8c">Email</text>
  <rect x="75" y="170" width="190" height="34" rx="6" fill="#ffffff"/>
  <text x="85" y="193" font-family="Arial, sans-serif" font-size="14" fill="#5b6b8c">Contraseña</text>
  <rect x="75" y="225" width="190" height="38" rx="6" fill="#f6c500"/>
  <text x="170" y="250" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0a2a5e">Entrar</text>
  <!-- Tarjeta de categorías -->
  <rect x="330" y="50" width="260" height="260" rx="14" fill="#0f3a7d" stroke="#f6c500" stroke-width="3"/>
  <text x="460" y="95" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#f6c500">Categorías</text>
  <rect x="352" y="115" width="216" height="32" rx="6" fill="#ffffff"/>
  <rect x="352" y="157" width="216" height="32" rx="6" fill="#ffffff"/>
  <rect x="352" y="199" width="216" height="32" rx="6" fill="#ffffff"/>
  <circle cx="548" cy="131" r="8" fill="#f6c500"/>
  <circle cx="548" cy="173" r="8" fill="#f6c500"/>
  <circle cx="548" cy="215" r="8" fill="#f6c500"/>
  <rect x="352" y="250" width="216" height="38" rx="6" fill="#f6c500"/>
  <text x="460" y="275" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0a2a5e">+ Nueva categoría</text>
</svg>
